name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run JUnit regression tests
        run: ./mvnw test

      - name: Run PIT mutation testing
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/

      - name: Run SpotBugs with SARIF output
        run: ./mvnw --batch-mode spotbugs:spotbugs

      - name: Upload SpotBugs results to code scanning
        if: ${{ always() && hashFiles('target/spotbugs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/spotbugs.sarif
          category: spotbugs
