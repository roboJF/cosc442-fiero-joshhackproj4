name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run JUnit regression tests
        run: ./mvnw test

      - name: Run PIT mutation testing
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage
      # Add PIT report artifact upload later
